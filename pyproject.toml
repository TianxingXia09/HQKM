[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqkm-reproducibility"
version = "1.0.0"
description = "Reproducibility code for a cost-benefit benchmark of budgeted quantum-kernel acquisition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "REPLACE_WITH_AUTHOR_NAME"}]
keywords = [
  "quantum machine learning",
  "quantum kernels",
  "multiple kernel learning",
  "Nystrom approximation",
  "reproducibility"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10"
]

[project.optional-dependencies]
datasets = ["scikit-learn>=1.3"]
test = ["pytest>=7"]
all = ["scikit-learn>=1.3", "pytest>=7"]

[project.urls]
Repository = "https://github.com/REPLACE_WITH_OWNER/REPLACE_WITH_REPOSITORY"
Issues = "https://github.com/REPLACE_WITH_OWNER/REPLACE_WITH_REPOSITORY/issues"

[tool.setuptools.packages.find]
include = ["hqkm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
